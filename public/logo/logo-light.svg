<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 120" width="380" height="120" role="img" aria-label="KooraLive">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0055A4"/>
      <stop offset="100%" stop-color="#EF4135"/>
    </linearGradient>
  </defs>

  <!-- Play button icon -->
  <rect x="8" y="20" width="72" height="80" rx="14" fill="url(#iconGrad)"/>
  <polygon points="30,42 30,78 62,60" fill="white" opacity="0.95"/>
  <path d="M68,38 Q82,60 68,82" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M74,30 Q94,60 74,90" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- Brand name -->
  <text
    x="94" y="72"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
