  >Koora<tspan fill="#EF4135" font-weight="900">Live</tspan></text>

  <!-- Tagline -->
  <text
    x="96" y="94"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="13" font-weight="500" letter-spacing="3.5"
