<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 120" width="380" height="120" role="img" aria-label="KooraLive">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4d9de0"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#EF4135"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0055A4"/>
      <stop offset="100%" stop-color="#EF4135"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Play button icon -->
  <rect x="8" y="20" width="72" height="80" rx="14" fill="url(#iconGrad)"/>
  <polygon points="30,42 30,78 62,60" fill="white" opacity="0.95"/>
  <!-- Signal arcs -->
  <path d="M68,38 Q82,60 68,82" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M74,30 Q94,60 74,90" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- Brand name -->
  <text
    x="94"
    y="72"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="46"
    font-weight="800"
    letter-spacing="-1"
    fill="url(#textGrad)"
    filter="url(#glow)"
  >Koora<tspan fill="#EF413nd5" font-weight="900">Live</tspan></text>

  <!-- Tagline -->
  <text
    x="96"
    y="94"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="13"
    font-weight="500"
    letter-spacing="3.5"
    fill="white"
    opacity="0.55"
  >STREAMING · 4K · SPORT</text>
</svg>
